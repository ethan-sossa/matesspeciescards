<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATES SPECIES CARDS 2026</title>
    <link rel="icon" type="image/png" href="/favicon.png">



    <style>
        :root {
          color-scheme: light;
          --page-bg: #f2f2f2;
          --card-bg: #ffffff;
          --text: #222222;
          --muted: #666666;
          --divider: #dddddd;
          --button-bg: #333333;
          --button-hover: #555555;
          --bordercolor: #000000;
        }

        body.dark-mode {
          color-scheme: dark;
          --page-bg: #17191c;
          --card-bg: #24282d;
          --text: #f1f3f5;
          --muted: #aeb6bf;
          --divider: #41474f;
          --button-bg: #454c55;
          --button-hover: #5a626d;
          --bordercolor: #ffffff;
        }
        
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px 15px 0px 15px;
        }

        .container {
            background: var(--card-bg);
            color: var(--text);
            padding: 30px;
            border-radius: 12px;
            width: 600px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px #0002;
        }

        h1 { margin-top: 0; }

        #animalImage {
          max-width: 100%;
          max-height: 400px;
          object-fit: contain;
          border-radius: 18px;
          border: 2px solid var(--bordercolor);
          overflow: hidden;
          display: block;
        }

        .answer {
            min-height: 27px;
            font-size: 20px;
            margin: 12px 0 5px;
            overflow-wrap: anywhere;
        }

        .answer.scientific { font-style: italic; }

        button {
            padding: 11px 17px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reveal { background: #287a45; }
        .reveal:hover { background: #1d6035; }

        .secondary { background: #65717d; }
        .secondary:hover { background: #4f5963; }

        .navigation {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        #progress {
            margin: 25px 0 0;
            padding-top: 10px;
            padding-bottom: -5px;
            border-top: 1px solid var(--divider);
            color: var(--muted);
            font-size: 14px;
        }

        .memory-bar {
            display: flex;
            height: 18px;
            width: 100%;
            overflow: hidden;
            border-radius: 999px;
            background: #9ca3af;
            margin-top: 12px;
        }
        .memory-segment { height: 100%; transition: width 0.2s ease; }
        #memoryNone { background: #9ca3af; }
        #memoryPartial { background: #eab308; }
        #memoryFull { background: #22a06b; }
        .memory-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 15px;
            margin-top: 10px;
            font-size: 12px;
        }
        .memory-legend span { display: inline-flex; align-items: center; gap: 5px; }
        .memory-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

        #status {
            color: #b3261e;
            font-size: 14px;
        }
        
        .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
        }
        
        .header h1 {
          margin: 0;
          position: relative;
          top: -1px;
        }

        .memorization-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .memorization-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .memorization-row input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #287a45;
        }

        .save-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
            gap: 5px;
        }

        .clear-save {
            background: #b3261e;
        }

        .clear-save:hover {
            background: #8c1d18;
        }
        .test-panel { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--divider); }
        .test-panel input, .test-panel select { width: 100%; padding: 11px; margin: 6px 0 12px; border: 1px solid var(--divider); border-radius: 6px; background: var(--card-bg); color: var(--text); font: inherit; }
        .test-panel label { display: block; text-align: left; font-size: 14px; }
        .test-panel .question-counter { color: var(--muted); }
        .test-panel .result-item { text-align: left; border-top: 1px solid var(--divider); padding: 12px 0; overflow-wrap: anywhere; }
        .test-panel .result-item p { margin: 5px 0; }
        .test-panel .correct { color: #23854b; }
        .test-panel .incorrect { color: #c53b32; }
        .test-panel .test-image { max-width: 100%; max-height: 360px; object-fit: contain; margin: 12px auto; display: block; border-radius: 12px; }
        .test-panel .test-nav { display: flex; flex-wrap: wrap; justify-content: center; }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
    <h1>SPECIES CARDS</h1>
      <button
          class="secondary"
          id="themeButton"
          onclick="toggleDarkMode()">
          DARK MODE
      </button>
    </div>

    <p id="status">Loading species...</p>

    <img id="animalImage" alt="Species image" hidden>

    <div class="answer" id="commonName"></div>
    <div class="memorization-row">
        <button class="reveal" id="commonButton" onclick="toggleCommon()" disabled>
            SHOW COMMON NAME
        </button>
        <label>
            <input type="checkbox" id="commonMemorized" onchange="updateMemorization()">
            Memorized?
        </label>
    </div>

    <div class="answer scientific" id="scientificName"></div>
    <div class="memorization-row">
       <button class="reveal" id="scientificButton" onclick="toggleScientific()" disabled>
            SHOW SCIENTIFIC NAME
        </button>
        <label>
            <input type="checkbox" id="scientificMemorized" onchange="updateMemorization()">
            Memorized?
        </label>
    </div>

    <div class="navigation">
        <button id="previousButton" onclick="previousAnimal()" disabled>PREVIOUS</button>
        <button id="nextButton" onclick="nextAnimal()" disabled>NEXT</button>
        <button class="secondary" id="shuffleButton" onclick="shuffleAnimals()" disabled>
            SHUFFLE ALL
        </button>
        <button class="secondary"
                id="shuffleUnmemorizedButton"
                onclick="shuffleUnmemorized()"
                disabled>
            SHUFFLE UNMEMORIZED
        </button>
    </div>

    <div class="save-controls">
        <button class="secondary" onclick="exportSave()">
            EXPORT SAVE
        </button>

        <button class="secondary" onclick="importSave()">
            IMPORT SAVE
        </button>

        <button class="clear-save" onclick="clearSave()">
            CLEAR SAVE
        </button>

        <button class="secondary" onclick="copySaveLink()">
            COPY SAVE LINK
        </button>
    </div>

    <div class="test-panel" id="testPanel">
      <div id="testSetup">
        <h2>TEST MODE</h2>
        <label for="testCount">Number of species</label>
        <input id="testCount" type="number" min="1" value="50">
        <label for="testTolerance">Answer tolerance</label>
        <select id="testTolerance">
          <option value="0">Exact spelling (ignore spaces, case and punctuation)</option>
          <option value="1" selected>Strict (1 typo per word)</option>
          <option value="2">Lenient (up to 2 typos per word)</option>
        </select>
        <button id="startTestButton" onclick="startTest()" disabled>START TEST</button>
      </div>
      <div id="testActive" hidden>
        <h2>TEST MODE</h2>
        <p class="question-counter" id="testCounter"></p>
        <img id="testImage" class="test-image" alt="Identify this species">
        <label for="testCommon">Common name</label>
        <input id="testCommon" type="text" autocomplete="off" spellcheck="false">
        <label for="testScientific">Scientific name</label>
        <input id="testScientific" type="text" autocomplete="off" spellcheck="false">
        <div class="test-nav">
          <button id="testPrev" onclick="testMove(-1)">PREVIOUS</button>
          <button id="testNext" onclick="testMove(1)">NEXT</button>
          <button class="clear-save" onclick="endTest()">END TEST NOW</button>
        </div>
      </div>
      <div id="testResults" hidden>
        <h2>TEST RESULTS</h2>
        <div id="testSummary"></div>
        <div id="testReview"></div>
        <button onclick="resetTest()">RETURN TO FLASHCARDS</button>
        <button onclick="resetTest(); startTest()">NEW TEST</button>
      </div>
    </div>
    <div id="progress">
        <div id="progressText">CARD 0/0 | 0% MEMORIZED</div>
        <div class="memory-bar" role="img" aria-label="Memorization progress" id="memoryBar">
            <div class="memory-segment" id="memoryNone" style="width:100%"></div>
            <div class="memory-segment" id="memoryPartial" style="width:0%"></div>
            <div class="memory-segment" id="memoryFull" style="width:0%"></div>
        </div>
        <div class="memory-legend">
            <span><i class="memory-dot" style="background:#9ca3af"></i><span id="noneLabel">0 Unmemorized</span></span>
            <span><i class="memory-dot" style="background:#eab308"></i><span id="partialLabel">0 Partial</span></span>
            <span><i class="memory-dot" style="background:#22a06b"></i><span id="fullLabel">0 Complete</span></span>
        </div>
    </div>
    <p style="padding-top: 0; padding-bottom: 0; color: var(--muted); margin: 10px 0 0;">made by ethan sossa.</p>
</div>

<script>
    let allAnimals = [];
    let animals =[];
    let currentIndex = 0;
    let memorization = JSON.parse(localStorage.getItem("speciesProgress") || "{}");

    const imageElement = document.getElementById("animalImage");
    const commonElement = document.getElementById("commonName");
    const scientificElement = document.getElementById("scientificName");
    const commonButton = document.getElementById("commonButton");
    const scientificButton = document.getElementById("scientificButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const shuffleButton = document.getElementById("shuffleButton");
    const progressElement = document.getElementById("progress");
    const statusElement = document.getElementById("status");
    const commonMemorized = document.getElementById("commonMemorized");
    const scientificMemorized = document.getElementById("scientificMemorized");
    const shuffleUnmemorizedButton =
        document.getElementById("shuffleUnmemorizedButton");
        

    async function loadSpecies() {
        try {
            const response = await fetch("./species.json");

            if (!response.ok) {
                throw new Error(`Could not load species.json (HTTP ${response.status}).`);
            }

            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0 ||
                !data.every(animal =>
                    animal &&
                    typeof animal.image === "string" &&
                    typeof animal.commonName === "string" &&
                    typeof animal.scientificName === "string"
                )) {
                throw new Error("   bad file :(((((((( tell me if you see this cuz its prob my fault");
            }

        allAnimals = data;
        animals = [...allAnimals];
        currentIndex = 0;

            statusElement.textContent = "";
            setControlsEnabled(true);
            document.getElementById("startTestButton").disabled = false;
            document.getElementById("testCount").max = allAnimals.length;
            displayAnimal();

            checkURLSave();

        } catch (error) {
            statusElement.textContent =
                error.message + "   bro how tf do you get this error 😭😭😭";
        }
    }

    function setControlsEnabled(enabled) {
        commonButton.disabled = !enabled;
        scientificButton.disabled = !enabled;
        previousButton.disabled = !enabled;
        nextButton.disabled = !enabled;
        shuffleButton.disabled = !enabled;
        commonMemorized.disabled = !enabled;
        scientificMemorized.disabled = !enabled;
        shuffleUnmemorizedButton.disabled = !enabled;
    }

    function displayAnimal() {
        if (animals.length === 0) return;

        const animal = animals[currentIndex];
        imageElement.src = animal.image;
        imageElement.hidden = false;

        imageElement.onerror = function() {
            statusElement.textContent = "no image yet hahaha! "   + animal.image;
        };

        imageElement.onload = function() {
            statusElement.textContent = "";
        };
        commonElement.textContent = "";
        scientificElement.textContent = "";
        commonButton.textContent = "SHOW COMMON NAME";
        scientificButton.textContent = "SHOW SCIENTIFIC NAME";

        const savedProgress = memorization[animal.scientificName] || {
            common: false,
            scientific: false
        };

        commonMemorized.checked = savedProgress.common;
        scientificMemorized.checked = savedProgress.scientific;

        updateProgress();

        previousButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === animals.length - 1;
    }

    function toggleCommon() {
        if (animals.length === 0) return;

        const isVisible = commonElement.textContent !== "";

        commonElement.textContent = isVisible
            ? ""
            : animals[currentIndex].commonName;

        commonButton.textContent = isVisible
            ? "SHOW COMMON NAME"
            : "HIDE COMMON NAME";
    }

    function toggleScientific() {
        if (animals.length === 0) return;

        const isVisible = scientificElement.textContent !== "";

        scientificElement.textContent = isVisible
            ? ""
            : animals[currentIndex].scientificName;

        scientificButton.textContent = isVisible
            ? "SHOW SCIENTIFIC NAME"
            : "HIDE SCIENTIFIC NAME";
    }

    function nextAnimal() {
        if (currentIndex < animals.length - 1) {
            currentIndex++;
            displayAnimal();
        }
    }

    function previousAnimal() {
        if (currentIndex > 0) {
            currentIndex--;
            displayAnimal();
        }
    }

    function shuffleList(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
    }

    function shuffleAnimals() {
        animals = [...allAnimals];

        shuffleList(animals);

        currentIndex = 0;
        displayAnimal();
    }

    function shuffleUnmemorized() {
        animals = allAnimals.filter(animal => {
            const progress = memorization[animal.scientificName];

            return !progress?.common || !progress?.scientific;
        });

        if (animals.length === 0) {
            animals = [...allAnimals];
            alert("Congratulations! You've memorized every species!");
            return;
        }

        shuffleList(animals);

        currentIndex = 0;
        displayAnimal();
    }

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle("dark-mode");

      document.getElementById("themeButton").textContent =
          isDark ? "LIGHT MODE" : "DARK MODE";
    }

    function updateMemorization() {
        const animal = animals[currentIndex];
        const key = animal.scientificName;

        memorization[key] = {
            common: commonMemorized.checked,
            scientific: scientificMemorized.checked
        };

        localStorage.setItem("speciesProgress", JSON.stringify(memorization));

        updateProgress();
    }

    function updateProgress() {
        let none = 0, partial = 0, full = 0;
        allAnimals.forEach(animal => {
            const saved = memorization[animal.scientificName] || {};
            const parts = Number(Boolean(saved.common)) + Number(Boolean(saved.scientific));
            if (parts === 0) none++;
            else if (parts === 1) partial++;
            else full++;
        });

        const total = allAnimals.length;
        const percentage = total ? Math.round((partial + 2 * full) / (2 * total) * 100) : 0;
        document.getElementById("progressText").textContent =
            `CARD ${currentIndex + 1}/${animals.length} | ${percentage}% MEMORIZED`;
        document.getElementById("memoryNone").style.width = `${total ? none / total * 100 : 100}%`;
        document.getElementById("memoryPartial").style.width = `${total ? partial / total * 100 : 0}%`;
        document.getElementById("memoryFull").style.width = `${total ? full / total * 100 : 0}%`;
        document.getElementById("noneLabel").textContent = `${none} UNMEMORIZED`;
        document.getElementById("partialLabel").textContent = `${partial} PARTIAL`;
        document.getElementById("fullLabel").textContent = `${full} MEMORIZED`;
        document.getElementById("memoryBar").setAttribute("aria-label",
            `${none} unmemorized, ${partial} partially memorized, ${full} fully memorized`);
    }

    const SAVE_VERSION = 2;

    function encodeSave(bytes) {
        let binary = "";

        for (const byte of bytes) {
            binary += String.fromCharCode(byte);
        }

        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    }

    function decodeSave(code) {
        const base64 = code
            .replace(/-/g, "+")
            .replace(/_/g, "/");

        const binary = atob(base64);

        return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    function calculateChecksum(bytes) {
        let checksum = 0;

        for (const byte of bytes) {
            checksum = (checksum + byte) % 256;
        }

        return checksum;
    }

    
    function generateSaveCode() {
        const count = allAnimals.length;

        if (count === 0) {
            throw new Error("Species have not finished loading.");
        }

        const progressBytes = Math.ceil(count * 2 / 8);
        const bytes = new Uint8Array(progressBytes + 4);

        bytes[0] = SAVE_VERSION;
        bytes[1] = (count >> 8) & 255;
        bytes[2] = count & 255;

        allAnimals.forEach((animal, index) => {
            const progress = memorization[animal.scientificName] || {};

            const bitIndex = index * 2;
            const byteIndex = 3 + Math.floor(bitIndex / 8);
            const offset = bitIndex % 8;

            if (progress.common) {
                bytes[byteIndex] |= 1 << offset;
            }

            if (progress.scientific) {
                bytes[byteIndex] |= 1 << (offset + 1);
            }
        });

        bytes[bytes.length - 1] =
            calculateChecksum(bytes.slice(0, -1));

        return "SC2-" + encodeSave(bytes);
    }

    async function exportSave() {
        try {
            const saveCode = generateSaveCode();

            await navigator.clipboard.writeText(saveCode);

            alert("Save code copied to clipboard!");
        } catch (error) {
            alert("Could not copy automatically. Please copy manually.");
            prompt("Copy your save code:", generateSaveCode());
        }
    }

    async function copySaveLink() {
        try {
            const url = new URL(window.location.href);
            url.search = "";
            url.hash = "";

            url.searchParams.set("code", generateSaveCode());

            await navigator.clipboard.writeText(url.toString());

            alert("Save link copied to clipboard!");
        } catch (error) {
            alert("Could not copy the save link: " + error.message);
        }
    }


    function importSave(providedCode = null) {
        const input = providedCode ?? prompt("Paste your save code:");

        if (input === null || !input.trim()) return;

        try {
            const saveCode = input.trim();

            if (!saveCode.startsWith("SC2-")) {
                throw new Error("Unsupported save code version.");
            }

            const bytes = decodeSave(saveCode.slice(4));

            if (bytes.length < 4 || bytes[0] !== SAVE_VERSION) {
                throw new Error("Invalid save version.");
            }

            const count = (bytes[1] << 8) | bytes[2];

            if (count !== allAnimals.length) {
                throw new Error("Species list size does not match.");
            }

            const expectedLength = Math.ceil(count * 2 / 8) + 4;

            if (bytes.length !== expectedLength) {
                throw new Error("Invalid save length.");
            }

            const checksum = calculateChecksum(bytes.slice(0, -1));

            if (checksum !== bytes[bytes.length - 1]) {
                throw new Error("Save code is corrupted.");
            }

            const importedProgress = {};

            allAnimals.forEach((animal, index) => {
                const bitIndex = index * 2;
                const byteIndex = 3 + Math.floor(bitIndex / 8);
                 const offset = bitIndex % 8;

                importedProgress[animal.scientificName] = {
                    common: Boolean(bytes[byteIndex] & (1 << offset)),
                    scientific: Boolean(bytes[byteIndex] & (1 << (offset + 1)))
                };
            });

            if (!confirm(
                "Import this save? Your current progress will be replaced."
            )) return;

            memorization = importedProgress;

            localStorage.setItem(
                "speciesProgress",
                JSON.stringify(memorization)
            );

            displayAnimal();

            alert("Save imported successfully!");

        } catch (error) {
            alert("Import failed: " + error.message);
        }
    }

    function clearSave() {
        const confirmed = confirm(
            "Are you sure you want to clear ALL memorization progress? This cannot be undone unless you have an exported save code."
        );
        if (!confirmed) return;
        memorization = {};
        localStorage.removeItem("speciesProgress");
        animals = [...allAnimals];
        currentIndex = 0;
        displayAnimal();
        alert("All memorization progress has been cleared!");
    }

    function checkURLSave() {
        const url = new URL(window.location.href);
        const saveCode = url.searchParams.get("code");
        if (!saveCode) return;
        url.searchParams.delete("code");
        window.history.replaceState({}, "", url.toString());
        importSave(saveCode);
    }

    let testQuestions = [];
    let testIndex = 0;
    let testTolerance = 1;
    const testAnswers = [];

    function normalizeAnswer(value) {
        return value.normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function editDistance(a, b) {
        let previous = Array.from({length: b.length + 1}, (_, i) => i);
        for (let i = 1; i <= a.length; i++) {
            const current = [i];
            for (let j = 1; j <= b.length; j++) {
                current[j] = Math.min(previous[j] + 1, current[j-1] + 1,
                    previous[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
            }
            previous = current;
        }
        return previous[b.length];
    }

    function matchesAnswer(guess, expected, scientific = false) {
        if (!scientific && /\([^()]+\)/.test(expected)) {
            const alternatives = [expected, expected.replace(/\([^()]*\)/g, " ").trim()];
            for (const match of expected.matchAll(/\(([^()]*)\)/g)) {
                alternatives.push(match[1].trim());
            }
            return alternatives.some(option => matchesCommonAlternative(guess, option));
        }
        return matchesCommonAlternative(guess, expected, scientific);
    }

    function matchesCommonAlternative(guess, expected, scientific = false) {
        if (!guess.trim()) return false;
        const a = normalizeAnswer(guess);
        const b = normalizeAnswer(expected);
        if (a === b) return true;
        if (testTolerance === 0) return false;
        if (scientific) {
            const parts = expected.trim().split(/\s+/);
            if (parts.length === 2) {
                const genus = normalizeAnswer(parts[0]);
                const species = normalizeAnswer(parts[1]);
                const typed = guess.trim().split(/\s+/).map(normalizeAnswer);
                if (typed.length === 2) {
                    return typed.every((part, i) => {
                        const target = i === 0 ? genus : species;
                        return part.length >= 3 && editDistance(part, target) <= testTolerance;
                    });
                }
            }
        }
        return a.length >= 5 && b.length >= 5 && editDistance(a, b) <= testTolerance;
    }

    function startTest() {
        if (!allAnimals.length) return;
        const countInput = document.getElementById("testCount");
        const count = Number(countInput.value);
        if (!Number.isInteger(count) || count < 1 || count > allAnimals.length) {
            alert(`Choose between 1 and ${allAnimals.length} species.`);
            return;
        }
        testTolerance = Number(document.getElementById("testTolerance").value);
        const pool = [...allAnimals];
        shuffleList(pool);
        testQuestions = pool.slice(0, count);
        testAnswers.length = 0;
        testQuestions.forEach(() => testAnswers.push({common: "", scientific: ""}));
        testIndex = 0;
        document.getElementById("testSetup").hidden = true;
        document.getElementById("testResults").hidden = true;
        document.getElementById("testActive").hidden = false;
        setFlashcardsVisible(false);
        showTestQuestion();
    }

    function setFlashcardsVisible(visible) {
        for (const id of ["animalImage", "commonName", "scientificName", "progress"]) {
            document.getElementById(id).hidden = !visible;
        }
        for (const selector of [".memorization-row", ".navigation", ".save-controls"]) {
            document.querySelector(selector).hidden = !visible;
            if (selector === ".memorization-row")
                document.querySelectorAll(selector).forEach(el => el.hidden = !visible);
        }
    }

    function saveTestAnswer() {
        if (!testQuestions.length) return;
        testAnswers[testIndex] = {
            common: document.getElementById("testCommon").value,
            scientific: document.getElementById("testScientific").value
        };
    }

    function showTestQuestion() {
        const animal = testQuestions[testIndex];
        document.getElementById("testCounter").textContent = `QUESTION ${testIndex+1}/${testQuestions.length}`;
        document.getElementById("testImage").src = animal.image;
        document.getElementById("testCommon").value = testAnswers[testIndex].common;
        document.getElementById("testScientific").value = testAnswers[testIndex].scientific;
        document.getElementById("testPrev").disabled = testIndex === 0;
        document.getElementById("testNext").disabled = testIndex === testQuestions.length - 1;
    }

    function testMove(step) {
        saveTestAnswer();
        const next = testIndex + step;
        if (next < 0 || next >= testQuestions.length) return;
        testIndex = next;
        showTestQuestion();
    }

    function endTest() {
        saveTestAnswer();
        if (!confirm("End this test and grade all questions? Unanswered names count as incorrect.")) return;
        document.getElementById("testActive").hidden = true;
        document.getElementById("testResults").hidden = false;
        let commonCorrect = 0, scientificCorrect = 0, attempted = 0;
        const review = document.getElementById("testReview");
        review.replaceChildren();
        testQuestions.forEach((animal, i) => {
            const answer = testAnswers[i];
            const c = matchesAnswer(answer.common, animal.commonName);
            const s = matchesAnswer(answer.scientific, animal.scientificName, true);
            commonCorrect += Number(c);
            scientificCorrect += Number(s);
            attempted += Number(Boolean(answer.common.trim())) + Number(Boolean(answer.scientific.trim()));
            const item = document.createElement("div");
            item.className = "result-item";
            const heading = document.createElement("strong");
            heading.textContent = `Question ${i+1}: ${animal.commonName} (${animal.scientificName})`;
            item.appendChild(heading);
            for (const [label, value, correct] of [["Common", answer.common, c], ["Scientific", answer.scientific, s]]) {
                const line = document.createElement("p");
                line.className = correct ? "correct" : "incorrect";
                line.textContent = `${label}: ${value.trim() || "[blank]"} — ${correct ? "Correct" : "Incorrect"}`;
                item.appendChild(line);
            }
            review.appendChild(item);
        });
        const earned = commonCorrect + scientificCorrect;
        const total = testQuestions.length * 2;
        const summary = document.getElementById("testSummary");
        summary.replaceChildren();
        for (const line of [
            `FINAL GRADE: ${earned}/${total} (${(earned / total * 100).toFixed(1)}%)`,
            `COMMON NAMES: ${commonCorrect}/${testQuestions.length}`,
            `SCIENTIFIC NAMES: ${scientificCorrect}/${testQuestions.length}`,
            `ANSWERED NAME FIELDS: ${attempted}/${total}`,
            `ACCURACY (ANSWERED ONLY): ${attempted ? (earned/attempted*100).toFixed(1) + "%" : "N/A"}`
        ]) {
            const p = document.createElement("p"); p.textContent = line; summary.appendChild(p);
        }
    }

    function resetTest() {
        testQuestions = [];
        testAnswers.length = 0;
        document.getElementById("testActive").hidden = true;
        document.getElementById("testResults").hidden = true;
        document.getElementById("testSetup").hidden = false;
        setFlashcardsVisible(true);
        displayAnimal();
    }

    loadSpecies();
</script>
</body>
</html>
