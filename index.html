<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATES SPECIES CARDS 2026</title>
    <link rel="icon" type="image/png" href="/favicon.png">



    <style>
        :root {
          color-scheme: light;
          --page-bg: #f2f2f2;
          --card-bg: #ffffff;
          --text: #222222;
          --muted: #666666;
          --divider: #dddddd;
          --button-bg: #333333;
          --button-hover: #555555;
          --bordercolor: #000000;
        }

        body.dark-mode {
          color-scheme: dark;
          --page-bg: #17191c;
          --card-bg: #24282d;
          --text: #f1f3f5;
          --muted: #aeb6bf;
          --divider: #41474f;
          --button-bg: #454c55;
          --button-hover: #5a626d;
          --bordercolor: #ffffff;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px 15px 0px 15px;
        }

        .container {
            background: var(--card-bg);
            color: var(--text);
            padding: 30px;
            border-radius: 12px;
            width: 600px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px #0002;
        }

        h1 { margin-top: 0; }

        #animalImage {
          max-width: 100%;
          max-height: 400px;
          object-fit: contain;
          border-radius: 18px;
          border: 2px solid var(--bordercolor);
          overflow: hidden;
          display: block;
        }

        .answer {
            min-height: 27px;
            font-size: 20px;
            margin: 12px 0 5px;
            overflow-wrap: anywhere;
        }

        .answer.scientific { font-style: italic; }

        button {
            padding: 11px 17px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reveal { background: #287a45; }
        .reveal:hover { background: #1d6035; }

        .secondary { background: #65717d; }
        .secondary:hover { background: #4f5963; }

        .navigation {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        #progress {
            margin: 25px 0 0;
            padding-top: 10px;
            padding-bottom: -5px;
            border-top: 1px solid var(--divider);
            color: var(--muted);
            font-size: 14px;
        }

        #status {
            color: #b3261e;
            font-size: 14px;
        }
        
        .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
        }
        
        .header h1 {
          margin: 0;
          position: relative;
          top: -1px;
        }

        .memorization-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .memorization-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .memorization-row input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #287a45;
        }

        .save-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
            gap: 5px;
        }

        .clear-save {
            background: #b3261e;
        }

        .clear-save:hover {
            background: #8c1d18;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
    <h1>SPECIES CARDS</h1>
      <button
          class="secondary"
          id="themeButton"
          onclick="toggleDarkMode()">
          DARK MODE
      </button>
    </div>

    <p id="status">Loading species...</p>

    <img id="animalImage" alt="Species image" hidden>

    <div class="answer" id="commonName"></div>
    <div class="memorization-row">
        <button class="reveal" id="commonButton" onclick="toggleCommon()" disabled>
            SHOW COMMON NAME
        </button>
        <label>
            <input type="checkbox" id="commonMemorized" onchange="updateMemorization()">
            Memorized?
        </label>
    </div>

    <div class="answer scientific" id="scientificName"></div>
    <div class="memorization-row">
       <button class="reveal" id="scientificButton" onclick="toggleScientific()" disabled>
            SHOW SCIENTIFIC NAME
        </button>
        <label>
            <input type="checkbox" id="scientificMemorized" onchange="updateMemorization()">
            Memorized?
        </label>
    </div>

    <div class="navigation">
        <button id="previousButton" onclick="previousAnimal()" disabled>PREVIOUS</button>
        <button id="nextButton" onclick="nextAnimal()" disabled>NEXT</button>
        <button class="secondary" id="shuffleButton" onclick="shuffleAnimals()" disabled>
            SHUFFLE ALL
        </button>
        <button class="secondary"
                id="shuffleUnmemorizedButton"
                onclick="shuffleUnmemorized()"
                disabled>
            SHUFFLE UNMEMORIZED
        </button>
    </div>

    <div class="save-controls">
        <button class="secondary" onclick="exportSave()">
            EXPORT SAVE
        </button>

        <button class="secondary" onclick="importSave()">
            IMPORT SAVE
        </button>

        <button class="clear-save" onclick="clearSave()">
            CLEAR SAVE
        </button>

        <button class="secondary" onclick="copySaveLink()">
            COPY SAVE LINK
        </button>
    </div>

    <p id="progress">CARD 0/0</p>
    <p style="padding-top: 0; padding-bottom: 0; color: var(--muted); margin: 10px 0 0;">made by ethan sossa.</p>
</div>

<script>
    let Allanimals = [];
    let animals =[];
    let currentIndex = 0;
    let memorization = JSON.parse(localStorage.getItem("speciesProgress") || "{}");

    const imageElement = document.getElementById("animalImage");
    const commonElement = document.getElementById("commonName");
    const scientificElement = document.getElementById("scientificName");
    const commonButton = document.getElementById("commonButton");
    const scientificButton = document.getElementById("scientificButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const shuffleButton = document.getElementById("shuffleButton");
    const progressElement = document.getElementById("progress");
    const statusElement = document.getElementById("status");
    const commonMemorized = document.getElementById("commonMemorized");
    const scientificMemorized = document.getElementById("scientificMemorized");
    const shuffleUnmemorizedButton =
        document.getElementById("shuffleUnmemorizedButton");
        

    async function loadSpecies() {
        try {
            const response = await fetch("./species.json");

            if (!response.ok) {
                throw new Error(`Could not load species.json (HTTP ${response.status}).`);
            }

            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0 ||
                !data.every(animal =>
                    animal &&
                    typeof animal.image === "string" &&
                    typeof animal.commonName === "string" &&
                    typeof animal.scientificName === "string"
                )) {
                throw new Error("   bad file :(((((((( tell me if you see this cuz its prob my fault");
            }

        allAnimals = data;
        animals = [...allAnimals];
        currentIndex = 0;

            statusElement.textContent = "";
            setControlsEnabled(true);
            displayAnimal();

            checkURLSave();

        } catch (error) {
            statusElement.textContent =
                error.message + "   bro how tf do you get this error 😭😭😭";
        }
    }

    function setControlsEnabled(enabled) {
        commonButton.disabled = !enabled;
        scientificButton.disabled = !enabled;
        previousButton.disabled = !enabled;
        nextButton.disabled = !enabled;
        shuffleButton.disabled = !enabled;
        commonMemorized.disabled = !enabled;
        scientificMemorized.disabled = !enabled;
        shuffleUnmemorizedButton.disabled = !enabled;
    }

    function displayAnimal() {
        if (animals.length === 0) return;

        const animal = animals[currentIndex];
        imageElement.src = animal.image;
        imageElement.hidden = false;

        imageElement.onerror = function() {
            statusElement.textContent = "no image yet hahaha! "   + animal.image;
        };

        imageElement.onload = function() {
            statusElement.textContent = "";
        };
        commonElement.textContent = "";
        scientificElement.textContent = "";
        commonButton.textContent = "SHOW COMMON NAME";
        scientificButton.textContent = "SHOW SCIENTIFIC NAME";

        const savedProgress = memorization[animal.scientificName] || {
            common: false,
            scientific: false
        };

        commonMemorized.checked = savedProgress.common;
        scientificMemorized.checked = savedProgress.scientific;

        updateProgress();

        previousButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === animals.length - 1;
    }

    function toggleCommon() {
        if (animals.length === 0) return;

        const isVisible = commonElement.textContent !== "";

        commonElement.textContent = isVisible
            ? ""
            : animals[currentIndex].commonName;

        commonButton.textContent = isVisible
            ? "SHOW COMMON NAME"
            : "HIDE COMMON NAME";
    }

    function toggleScientific() {
        if (animals.length === 0) return;

        const isVisible = scientificElement.textContent !== "";

        scientificElement.textContent = isVisible
            ? ""
            : animals[currentIndex].scientificName;

        scientificButton.textContent = isVisible
            ? "SHOW SCIENTIFIC NAME"
            : "HIDE SCIENTIFIC NAME";
    }

    function nextAnimal() {
        if (currentIndex < animals.length - 1) {
            currentIndex++;
            displayAnimal();
        }
    }

    function previousAnimal() {
        if (currentIndex > 0) {
            currentIndex--;
            displayAnimal();
        }
    }

    // Shuffle
    function shuffleList(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
    }

    function shuffleAnimals() {
        animals = [...allAnimals];

        shuffleList(animals);

        currentIndex = 0;
        displayAnimal();
    }

    function shuffleUnmemorized() {
        animals = allAnimals.filter(animal => {
            const progress = memorization[animal.scientificName];

            return !progress?.common || !progress?.scientific;
        });

        if (animals.length === 0) {
            animals = [...allAnimals];
            alert("Congratulations! You've memorized every species!");
            return;
        }

        shuffleList(animals);

        currentIndex = 0;
        displayAnimal();
    }

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle("dark-mode");

      document.getElementById("themeButton").textContent =
          isDark ? "LIGHT MODE" : "DARK MODE";
    }

    function updateMemorization() {
        const animal = animals[currentIndex];
        const key = animal.scientificName;

        memorization[key] = {
            common: commonMemorized.checked,
            scientific: scientificMemorized.checked
        };

        localStorage.setItem("speciesProgress", JSON.stringify(memorization));

        updateProgress();
    }

    function updateProgress() {
        let memorizedCount = 0;

        allAnimals.forEach(animal => {
            const progress = memorization[animal.scientificName];

            if (progress?.common) memorizedCount++;
            if (progress?.scientific) memorizedCount++;
        });

        const total = allAnimals.length * 2;
        const percentage = Math.round((memorizedCount / total) * 100);

        progressElement.textContent =
            `CARD ${currentIndex + 1}/${animals.length} | ${percentage}% MEMORIZED`;
    }


    const SAVE_VERSION = 2;

    // Convert bytes to a compact, copyable Base64URL string.
    function encodeSave(bytes) {
        let binary = "";

        for (const byte of bytes) {
            binary += String.fromCharCode(byte);
        }

        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    }

    // Convert a save code back into bytes.
    function decodeSave(code) {
        const base64 = code
            .replace(/-/g, "+")
            .replace(/_/g, "/");

        const binary = atob(base64);

        return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    // Simple checksum for detecting accidental changes.
    function calculateChecksum(bytes) {
        let checksum = 0;

        for (const byte of bytes) {
            checksum = (checksum + byte) % 256;
        }

        return checksum;
    }

    function exportSave() {
        // Always use the original species order.
        const count = allAnimals.length;

        // Two bits per species, plus 4 metadata bytes.
        const progressBytes = Math.ceil(count * 2 / 8);
        const bytes = new Uint8Array(progressBytes + 4);

        bytes[0] = SAVE_VERSION;
        bytes[1] = (count >> 8) & 255;
        bytes[2] = count & 255;

        allAnimals.forEach((animal, index) => {
            const progress = memorization[animal.scientificName] || {};

            const bitIndex = index * 2;
            const byteIndex = 3 + Math.floor(bitIndex / 8);
            const offset = bitIndex % 8;

            if (progress.common) {
                bytes[byteIndex] |= 1 << offset;
            }

            if (progress.scientific) {
                bytes[byteIndex] |= 1 << (offset + 1);
            }
        });

        // Final byte stores the checksum.
        bytes[bytes.length - 1] =
            calculateChecksum(bytes.slice(0, -1));

        const saveCode = "SC2-" + encodeSave(bytes);

        navigator.clipboard.writeText(saveCode)
            .then(() => alert("Save code copied to clipboard!"))
            .catch(() => prompt("Copy your save code:", saveCode));
    }

    function importSave(providedCode = null) {
        const input = providedCode ?? prompt("Paste your save code:");

        if (input === null || !input.trim()) return;

        try {
            const saveCode = input.trim();

            if (!saveCode.startsWith("SC2-")) {
                throw new Error("Unsupported save code version.");
            }

            const bytes = decodeSave(saveCode.slice(4));

            if (bytes.length < 4 || bytes[0] !== SAVE_VERSION) {
                throw new Error("Invalid save version.");
            }

            const count = (bytes[1] << 8) | bytes[2];

            if (count !== allAnimals.length) {
                throw new Error("Species list size does not match.");
            }

            const expectedLength = Math.ceil(count * 2 / 8) + 4;

            if (bytes.length !== expectedLength) {
                throw new Error("Invalid save length.");
            }

            const checksum = calculateChecksum(bytes.slice(0, -1));

            if (checksum !== bytes[bytes.length - 1]) {
                throw new Error("Save code is corrupted.");
            }

            const importedProgress = {};

            allAnimals.forEach((animal, index) => {
                const bitIndex = index * 2;
                const byteIndex = 3 + Math.floor(bitIndex / 8);
                 const offset = bitIndex % 8;

                importedProgress[animal.scientificName] = {
                    common: Boolean(bytes[byteIndex] & (1 << offset)),
                    scientific: Boolean(bytes[byteIndex] & (1 << (offset + 1)))
                };
            });

            if (!confirm(
                "Import this save? Your current progress will be replaced."
            )) return;

            memorization = importedProgress;

            localStorage.setItem(
                "speciesProgress",
                JSON.stringify(memorization)
            );

            displayAnimal();

            alert("Save imported successfully!");

        } catch (error) {
            alert("Import failed: " + error.message);
        }
    }

    function clearSave() {
        const confirmed = confirm(
            "Are you sure you want to clear ALL memorization progress? This cannot be undone unless you have an exported save code."
        );
        if (!confirmed) return;
        memorization = {};
        localStorage.removeItem("speciesProgress");
        animals = [...allAnimals];
        currentIndex = 0;
        displayAnimal();
        alert("All memorization progress has been cleared!");
    }

    function checkURLSave() {
        const url = new URL(window.location.href);
        const saveCode = url.searchParams.get("code");
        if (!saveCode) return;
        url.searchParams.delete("code");
        window.history.replaceState({}, "", url.toString());
        importSave(saveCode);
    }

    function copySaveLink() {
        const url = new URL(window.location.href);

        url.searchParams.set("code", generateSaveCode());

        navigator.clipboard.writeText(url.toString())
            .then(() => alert("Save link copied!"))
            .catch(() => alert("Could not copy link."));
    }

    loadSpecies();
</script>
</body>
</html>
